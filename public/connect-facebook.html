<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Facebook - VIRALOOP</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #020617, #0b1220);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #2a2f3b;
            text-align: center;
        }

        h1 { color: #22c55e; margin-bottom: 16px; }

        .subtitle { color: #9ca3af; margin-bottom: 30px; }

        .btn-facebook {
            background: #1877f2;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-facebook:hover {
            background: #166fe5;
        }

        .benefits {
            text-align: left;
            background: #1f2937;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            color: #d1d5db;
        }

        .benefits h3 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        .page-item {
            background: #1f2937;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-name { color: white; }

        .page-id { color: #6b7280; font-size: 12px; }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: #22c55e;
        }

        .save-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .error { color: #fca5a5; margin-top: 10px; }

        .success { color: #86efac; margin-top: 10px; }

        .skip {
            display: block;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔗 Connect Facebook</h1>
    <div class="subtitle">Connect your pages to start automation</div>

    <div class="benefits">
        <h3>What you get</h3>
        <ul>
            <li>Auto post scheduling</li>
            <li>AI content generation</li>
            <li>Page analytics</li>
            <li>Message automation</li>
        </ul>
    </div>

    <div id="msg"></div>

    <div id="pagesBox" style="display:none; text-align:left;">
        <h3 style="color:white; margin-bottom:10px;">Select Pages</h3>
        <div id="pagesList"></div>

        <button id="saveBtn" class="save-btn">Save Pages</button>
    </div>

    <button id="connectBtn" class="btn-facebook">Connect with Facebook</button>

    <a class="skip" href="/index.html">Skip for now</a>

</div>


    <script>
const connectBtn = document.getElementById('connectBtn');
const pagesContainer = document.getElementById('pagesContainer');
const pagesList = document.getElementById('pagesList');
const saveBtn = document.getElementById('savePagesBtn');
const messageContainer = document.getElementById('messageContainer');

let selectedPages = [];

function showMessage(message, isError = true) {
    messageContainer.innerHTML =
        `<div class="${isError ? 'error' : 'success'}">${message}</div>`;
}

function escapeHtml(str) {
    if (!str) return '';

    return str.replace(/[&<>"]/g, function (m) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;'
        }[m];
    });
}

connectBtn.addEventListener('click', () => {
    window.location.href = '/api/facebook/connect';
});

async function loadPagesFromSession() {
    try {
        const res = await fetch('/api/facebook/temp-pages', {
            credentials: 'include'
        });

        const data = await res.json();

        if (!res.ok) {
            showMessage('Failed to load Facebook pages.', true);
            return;
        }

        const pages = data.pages || [];

        if (!pages.length) {
            showMessage('No Facebook pages found.', true);
            return;
        }

        displayPages(pages);

        showMessage(
            `Found ${pages.length} page(s). Select which pages to connect.`,
            false
        );

    } catch (err) {
        console.error(err);
        showMessage('Unable to load pages.', true);
    }
}

function displayPages(pages) {

    selectedPages = [];
    pagesList.innerHTML = '';

    pages.forEach(page => {

        const div = document.createElement('div');

        div.className = 'page-item';

        div.innerHTML = `
            <div>
                <div class="page-name">${escapeHtml(page.name)}</div>
                <div class="page-id">ID: ${page.id}</div>
            </div>

            <input
                type="checkbox"
                class="checkbox"
                data-page-id="${page.id}"
            >
        `;

        const checkbox = div.querySelector('.checkbox');

        checkbox.addEventListener('change', () => {

            if (checkbox.checked) {

                selectedPages.push({
                    id: page.id,
                    name: page.name,
                    access_token: page.access_token
                });

            } else {

                selectedPages =
                    selectedPages.filter(
                        p => p.id !== page.id
                    );
            }
        });

        pagesList.appendChild(div);
    });

    pagesContainer.style.display = 'block';
    connectBtn.style.display = 'none';
}

saveBtn.addEventListener('click', async () => {

    if (!selectedPages.length) {
        showMessage(
            'Please select at least one page.',
            true
        );
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {

        const res = await fetch(
            '/api/facebook/save-pages',
            {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    pages: selectedPages
                })
            }
        );

        const data = await res.json();

        if (!res.ok) {
            throw new Error(
                data.error || 'Save failed'
            );
        }

        showMessage(
            `Successfully connected ${data.count} page(s)!`,
            false
        );

        setTimeout(() => {
            window.location.href = '/index.html';
        }, 1500);

    } catch (err) {

        console.error(err);

        showMessage(
            err.message || 'Save failed.',
            true
        );

        saveBtn.disabled = false;
        saveBtn.textContent =
            'Save Selected Pages';
    }
});

const params =
    new URLSearchParams(window.location.search);

if (params.get('error')) {

    const error = params.get('error');

    const messages = {
        facebook_denied:
            'Facebook access was denied.',

        no_pages:
            'No Facebook pages found.',

        no_code:
            'Facebook authorization failed.',

        invalid_state:
            'Session expired. Please reconnect.',

        server_error:
            'Server error occurred.'
    };

    showMessage(
        messages[error] || error,
        true
    );
}

if (params.get('success') === 'true') {
    loadPagesFromSession();
}
</script>
