<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Facebook - VIRALOOP</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #020617, #0b1220);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid #2a2f3b;
            text-align: center;
        }

        h1 { color: #22c55e; margin-bottom: 16px; }

        .subtitle { color: #9ca3af; margin-bottom: 30px; }

        .btn-facebook {
            background: #1877f2;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-facebook:hover {
            background: #166fe5;
        }

        .benefits {
            text-align: left;
            background: #1f2937;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            color: #d1d5db;
        }

        .benefits h3 {
            color: #22c55e;
            margin-bottom: 10px;
        }

        .page-item {
            background: #1f2937;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-name { color: white; }

        .page-id { color: #6b7280; font-size: 12px; }

        .checkbox {
            width: 18px;
            height: 18px;
            accent-color: #22c55e;
        }

        .save-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .error { color: #fca5a5; margin-top: 10px; }

        .success { color: #86efac; margin-top: 10px; }

        .skip {
            display: block;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔗 Connect Facebook</h1>
    <div class="subtitle">Connect your pages to start automation</div>

    <div class="benefits">
        <h3>What you get</h3>
        <ul>
            <li>Auto post scheduling</li>
            <li>AI content generation</li>
            <li>Page analytics</li>
            <li>Message automation</li>
        </ul>
    </div>

    <div id="msg"></div>

    <div id="pagesBox" style="display:none; text-align:left;">
        <h3 style="color:white; margin-bottom:10px;">Select Pages</h3>
        <div id="pagesList"></div>

        <button id="saveBtn" class="save-btn">Save Pages</button>
    </div>

    <button id="connectBtn" class="btn-facebook">Connect with Facebook</button>

    <a class="skip" href="/index.html">Skip for now</a>

</div>

<script>

const connectBtn = document.getElementById("connectBtn");
const pagesBox = document.getElementById("pagesBox");
const pagesList = document.getElementById("pagesList");
const saveBtn = document.getElementById("saveBtn");
const msg = document.getElementById("msg");

let selectedPages = [];
let accessToken = null;

function showMessage(text, ok=false){
    msg.innerHTML = `<div class="${ok ? 'success' : 'error'}">${text}</div>`;
}

connectBtn.onclick = () => {
    window.location.href = "/api/facebook/connect";
};

/* =========================================
   NEW: session-based page loading
========================================= */

const params = new URLSearchParams(window.location.search);
const success = params.get("success");
const error = params.get("error");

if(error){
    showMessage(error);
}

if(success === "true"){
    fetch("/api/facebook/temp-pages", {
        credentials: "include"
    })
    .then(r => r.json())
    .then(data => {

        if(!data.pages || data.pages.length === 0){
            showMessage("No pages found");
            return;
        }

        accessToken = data.token;

        pagesBox.style.display = "block";
        connectBtn.style.display = "none";

        pagesList.innerHTML = "";

        data.pages.forEach(page => {

            const div = document.createElement("div");
            div.className = "page-item";

            div.innerHTML = `
                <div>
                    <div class="page-name">${page.name}</div>
                    <div class="page-id">ID: ${page.id}</div>
                </div>
                <input type="checkbox" class="checkbox"
                    data-id="${page.id}"
                    data-name="${page.name}"
                    data-token="${page.access_token || ''}">
            `;

            pagesList.appendChild(div);
        });

        document.querySelectorAll(".checkbox").forEach(cb => {
            cb.onchange = () => {

                const page = {
                    id: cb.dataset.id,
                    name: cb.dataset.name,
                    access_token: cb.dataset.token
                };

                if(cb.checked){
                    selectedPages.push(page);
                } else {
                    selectedPages = selectedPages.filter(p => p.id !== page.id);
                }
            };
        });

    })
    .catch(() => {
        showMessage("Failed to load pages");
    });
}

/* =========================================
   SAVE PAGES
========================================= */

saveBtn.onclick = async () => {

    if(selectedPages.length === 0){
        showMessage("Select at least one page");
        return;
    }

    saveBtn.disabled = true;
    saveBtn.innerText = "Saving...";

    try {

        const res = await fetch("/api/facebook/save-pages", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                pages: selectedPages,
                accessToken
            })
        });

        const data = await res.json();

        if(data.success){
            showMessage("Pages connected successfully!", true);

            setTimeout(() => {
                window.location.href = "/index.html";
            }, 1500);
        } else {
            showMessage(data.error || "Failed");
            saveBtn.disabled = false;
            saveBtn.innerText = "Save Pages";
        }

    } catch (e) {
        showMessage("Network error");
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Pages";
    }
};

</script>

</body>
</html>
