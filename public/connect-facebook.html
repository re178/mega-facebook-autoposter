<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connect Facebook</title>

<style>
body {
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 650px;
    background: #111827;
    padding: 20px;
    border-radius: 15px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
}

.connect {
    background: #1877f2;
    color: white;
}

.save {
    background: #22c55e;
    width: 100%;
}

.page {
    display: flex;
    justify-content: space-between;
    background: #1f2937;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
}

small {
    color: #9ca3af;
}
</style>
</head>

<body>

<div class="container">

    <h2>Facebook Pages</h2>

    <button class="connect" id="connectBtn">Connect Facebook</button>

    <div id="pagesBox"></div>

    <button class="save" id="saveBtn" style="display:none;">Save Selected Pages</button>

</div>

<script>
const connectBtn = document.getElementById("connectBtn");
const saveBtn = document.getElementById("saveBtn");
const pagesBox = document.getElementById("pagesBox");

let pages = [];
let selected = [];

/* =========================
   CONNECT
========================= */
connectBtn.onclick = () => {
    window.location.href = "/api/facebook/connect";
};

/* =========================
   LOAD PAGES FROM SESSION
========================= */
async function loadPages() {
    try {
        const res = await fetch("/api/facebook/temp-pages", {
            credentials: "include"
        });

        const data = await res.json();

        console.log("📦 TEMP PAGES:", data);

        if (!data.pages || data.pages.length === 0) {
            pagesBox.innerHTML = "<p>No pages found</p>";
            return;
        }

        pages = data.pages;
        pagesBox.innerHTML = "";

        data.pages.forEach(p => {

            const div = document.createElement("div");
            div.className = "page";

            div.innerHTML = `
                <div>
                    <b>${p.name}</b><br/>
                    <small>ID: ${p.id}</small><br/>
                    <small>${p.access_token ? "Token OK" : "NO TOKEN"}</small>
                </div>
                <input type="checkbox" data-id="${p.id}">
            `;

            pagesBox.appendChild(div);
        });

        document.querySelectorAll("input[type='checkbox']").forEach(cb => {
            cb.addEventListener("change", () => {

                const id = cb.dataset.id;

                if (cb.checked) {
                    if (!selected.includes(id)) selected.push(id);
                } else {
                    selected = selected.filter(x => x !== id);
                }

                console.log("🎯 SELECTED:", selected);

                saveBtn.style.display = selected.length ? "block" : "none";
            });
        });

    } catch (err) {
        console.error(err);
        pagesBox.innerHTML = "<p>Error loading pages</p>";
    }
}

/* =========================
   SAVE PAGES (ONLY IDS)
========================= */
saveBtn.onclick = async () => {

    try {

        console.log("📤 SENDING IDS:", selected);

        const res = await fetch("/api/facebook/save-pages", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                pages: selected
            })
        });

        const data = await res.json();

        console.log("💾 SAVE RESPONSE:", data);

        if (data.success) {
            alert(`Saved ${data.saved} pages`);
            window.location.href = "/index.html";
        } else {
            alert(data.error || "Failed to save");
        }

    } catch (err) {
        console.error(err);
        alert("Network error");
    }
};

/* =========================
   AUTO LOAD AFTER SUCCESS
========================= */
if (window.location.search.includes("success=true")) {
    loadPages();
}
</script>

</body>
</html>
