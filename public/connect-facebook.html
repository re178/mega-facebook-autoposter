<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connect Facebook - VIRALOOP</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #020617, #0b1220);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: rgba(17, 24, 39, 0.95);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 600px;
    border: 1px solid #2a2f3b;
    text-align: center;
}

h1 { color: #22c55e; margin-bottom: 10px; }

.subtitle { color: #9ca3af; margin-bottom: 20px; }

.btn {
    background: #1877f2;
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover { background: #166fe5; }

.save-btn {
    background: #22c55e;
    width: 100%;
    margin-top: 15px;
}

.page {
    display: flex;
    justify-content: space-between;
    background: #1f2937;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    color: white;
}

.hidden { display: none; }

.message {
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
}

.error { background: rgba(255,0,0,0.1); color: #fca5a5; }
.success { background: rgba(0,255,0,0.1); color: #86efac; }
</style>
</head>

<body>

<div class="container">
    <h1>Connect Facebook</h1>
    <div class="subtitle">Link your Facebook Pages</div>

    <div id="message"></div>

    <button id="connectBtn" class="btn">Connect Facebook</button>

    <div id="pagesSection" class="hidden">
        <h3 style="color:white; margin-top:20px;">Select Pages</h3>
        <div id="pagesList"></div>
        <button id="saveBtn" class="btn save-btn">Save Pages</button>
    </div>
</div>

<script>
/* =========================
   ELEMENTS (SAFE)
========================= */
const connectBtn = document.getElementById('connectBtn');
const saveBtn = document.getElementById('saveBtn');
const pagesSection = document.getElementById('pagesSection');
const pagesList = document.getElementById('pagesList');
const messageBox = document.getElementById('message');

/* =========================
   SAFE MESSAGE
========================= */
function showMessage(msg, type = "error") {
    messageBox.innerHTML = `<div class="message ${type}">${msg}</div>`;
}

/* =========================
   CHECK URL STATUS
========================= */
const url = new URL(window.location.href);
const error = url.searchParams.get('error');
const success = url.searchParams.get('success');

if (error) {
    showMessage("Facebook error: " + error, "error");
}

/* =========================
   CONNECT BUTTON
========================= */
if (connectBtn) {
    connectBtn.addEventListener('click', () => {
        window.location.href = '/api/facebook/connect';
    });
}

/* =========================
   LOAD TEMP PAGES (IMPORTANT FIX)
========================= */
async function loadPages() {
    try {
        const res = await fetch('/api/facebook/temp-pages', {
            credentials: 'include'
        });

        const data = await res.json();

        if (!data.pages || data.pages.length === 0) {
            showMessage("No pages found. Try reconnecting Facebook.", "error");
            return;
        }

        renderPages(data.pages, data.token);
    } catch (err) {
        showMessage("Failed to load pages", "error");
    }
}

/* =========================
   RENDER PAGES
========================= */
let selected = [];
let accessToken = null;

function renderPages(pages, token) {
    accessToken = token;
    pagesSection.classList.remove('hidden');
    pagesList.innerHTML = "";
    selected = [];

    pages.forEach(page => {
        const div = document.createElement('div');
        div.className = "page";

        div.innerHTML = `
            <div>
                <strong>${page.name}</strong><br/>
                <small>ID: ${page.id}</small>
            </div>
            <input type="checkbox" data-id="${page.id}">
        `;

        pagesList.appendChild(div);
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
            const id = cb.dataset.id;

            if (cb.checked) {
                const page = pages.find(p => p.id === id);
                selected.push(page);
            } else {
                selected = selected.filter(p => p.id !== id);
            }
        });
    });
}

/* =========================
   SAVE PAGES
========================= */
if (saveBtn) {
    saveBtn.addEventListener('click', async () => {
        if (selected.length === 0) {
            showMessage("Select at least one page", "error");
            return;
        }

        try {
            const res = await fetch('/api/facebook/save-pages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    pages: selected
                })
            });

            const data = await res.json();

            if (data.success) {
                showMessage("Pages saved successfully!", "success");

                setTimeout(() => {
                    window.location.href = "/index.html";
                }, 1500);
            } else {
                showMessage(data.error || "Failed to save pages", "error");
            }

        } catch (err) {
            showMessage("Network error", "error");
        }
    });
}

/* =========================
   AUTO LOAD AFTER SUCCESS
========================= */
if (success === "true") {
    loadPages();
}
</script>

</body>
</html>
