<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrfToken }}">
    <title>Reset Password - VIRALOOP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #020617, #0b1220);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #2a2f3b;
        }
        h1 { color: #22c55e; text-align: center; margin-bottom: 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 32px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover:not(:disabled) { background: #16a34a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; }
        .success { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #86efac; }
        .password-hint { font-size: 11px; color: #6b7280; margin-top: -12px; margin-bottom: 16px; }
        .footer { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #2a2f3b; font-size: 11px; color: #4b5563; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set New Password</h1>
        <div class="subtitle">Enter your new password below</div>
        
        <div id="messageContainer"></div>
        
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="New Password (min 6 characters)" required autocomplete="new-password">
            <div class="password-hint">Minimum 6 characters</div>
            <input type="password" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password">
            <button type="submit" id="resetBtn">Reset Password</button>
        </form>
        
        <div class="footer">
            <a href="/privacy">Privacy</a> | <a href="/terms">Terms</a>
            <p style="margin-top: 12px;">&copy; 2025 VIRALOOP</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const messageContainer = document.getElementById('messageContainer');
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            messageContainer.innerHTML = '<div class="message error">Invalid reset link. Please request a new one.</div>';
            resetBtn.disabled = true;
        }
        
        function showMessage(message, isError = true) {
            messageContainer.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${message}</div>`;
            setTimeout(() => {
                if (messageContainer.firstChild) messageContainer.firstChild.remove();
            }, 5000);
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!newPassword || !confirmPassword) {
                showMessage('Please fill in both fields');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match');
                return;
            }
            
            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';
            
            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrfToken ? { 'X-CSRF-Token': csrfToken } : {})
                    },
                    credentials: 'include',
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    showMessage('Password has been reset! Redirecting to login...', false);
                    setTimeout(() => {
                        window.location.href = '/login?reset=true';
                    }, 2000);
                } else {
                    showMessage(data.error || 'Failed to reset password. Please try again.');
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            } catch (err) {
                showMessage('Network error. Please try again.');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
