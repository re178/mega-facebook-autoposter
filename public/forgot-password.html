<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrfToken }}">
    <title>Forgot Password - VIRALOOP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #020617, #0b1220);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid #2a2f3b;
        }
        h1 { color: #22c55e; text-align: center; margin-bottom: 8px; font-size: 28px; }
        .subtitle { text-align: center; color: #9ca3af; margin-bottom: 32px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #22c55e;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #16a34a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; }
        .success { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #86efac; }
        .back-link { text-align: center; margin-top: 24px; font-size: 14px; }
        .back-link a { color: #22c55e; text-decoration: none; }
        .footer { text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #2a2f3b; font-size: 11px; color: #4b5563; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Forgot Password</h1>
        <div class="subtitle">We'll send you a link to reset your password</div>
        
        <div id="messageContainer"></div>
        
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>
        
        <div class="back-link">
            <a href="/login">← Back to Login</a>
        </div>
        
        <div class="footer">
            <a href="/privacy">Privacy</a> | <a href="/terms">Terms</a>
            <p style="margin-top: 12px;">&copy; 2025 VIRALOOP</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageContainer = document.getElementById('messageContainer');
        
        function showMessage(message, isError = true) {
            messageContainer.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${message}</div>`;
            setTimeout(() => {
                if (messageContainer.firstChild) messageContainer.firstChild.remove();
            }, 5000);
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            
            if (!email) {
                showMessage('Email is required');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrfToken ? { 'X-CSRF-Token': csrfToken } : {})
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    showMessage('If an account exists with this email, you will receive a password reset link.', false);
                    document.getElementById('email').value = '';
                } else {
                    showMessage(data.error || 'Something went wrong. Please try again.');
                }
            } catch (err) {
                showMessage('Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
