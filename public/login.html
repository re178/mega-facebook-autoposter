<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Automatic Facebook Poster</title>
<meta name="csrf-token" content="{{ csrfToken }}">
<link rel="stylesheet" href="css/style.css">
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #020617, #0b1220);
    position: relative;
    overflow: hidden;
}
body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: url('img/watermark.png') no-repeat center center;
    background-size: 40%;
    opacity: 0.05;
    pointer-events: none;
}
.login-card {
    background: rgba(11, 18, 32, 0.9);
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    position: relative;
    z-index: 10;
    width: 350px;
    text-align: center;
}
.login-card img.logo {
    width: 80px;
    margin-bottom: 20px;
}
.login-card h1 {
    font-size: 22px;
    margin-bottom: 24px;
    color: #22c55e;
}
.login-card input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #0f172a;
    background: #1f2430;
    color: #fff;
    font-size: 14px;
}
.login-card button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #22c55e;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.login-card button:hover:not(:disabled) {
    opacity: 0.9;
}
.login-card button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.error-message {
    color: #ff4c4c;
    margin-top: 10px;
    font-size: 14px;
    background: rgba(255,76,76,0.1);
    padding: 8px;
    border-radius: 6px;
}
.footer-text {
    margin-top: 20px;
    font-size: 12px;
    color: #6c757d;
}
</style>
</head>
<body>
<div class="login-card">
    <img src="img/Logo.png" alt="Logo" class="logo">
    <h1>Automatic Facebook Poster</h1>

    <form id="loginForm">
        <input type="email" id="email" name="email" placeholder="Email" required autofocus>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Login</button>
        <div id="login-error" class="error-message"></div>
    </form>

    <div class="footer-text">
        &copy; 2026 GIGICRAFT
    </div>
</div>

<script src="js/Login.js"></script>
</body>
</html>
