<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - VIRALOOP SOCIAL POSTER</title>
<meta name="csrf-token" content="{{ csrfToken }}">
<link rel="stylesheet" href="css/style.css">
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #020617, #0b1220);
    position: relative;
    overflow: hidden;
}
body::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: url('img/watermark.png') no-repeat center center;
    background-size: 40%;
    opacity: 0.05;
    pointer-events: none;
}
.login-card {
    background: rgba(11, 18, 32, 0.9);
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    position: relative;
    z-index: 10;
    width: 350px;
    text-align: center;
}
.login-card img.logo {
    width: 80px;
    margin-bottom: 20px;
}
.login-card h1 {
    font-size: 22px;
    margin-bottom: 24px;
    color: #22c55e;
}
.login-card input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #0f172a;
    background: #1f2430;
    color: #fff;
    font-size: 14px;
}
.login-card button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #22c55e;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.login-card button:hover:not(:disabled) {
    opacity: 0.9;
}
.login-card button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.error-message {
    color: #ff4c4c;
    margin-top: 10px;
    font-size: 14px;
    background: rgba(255,76,76,0.1);
    padding: 8px;
    border-radius: 6px;
}
.success-message {
    color: #22c55e;
    margin-top: 10px;
    font-size: 14px;
    background: rgba(34,197,94,0.1);
    padding: 8px;
    border-radius: 6px;
}
.links {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 13px;
}
.links a {
    color: #9ca3af;
    text-decoration: none;
    transition: color 0.3s;
}
.links a:hover {
    color: #22c55e;
}
.footer-text {
    margin-top: 20px;
    font-size: 11px;
    color: #4b5563;
}
.footer-text a {
    color: #6b7280;
    text-decoration: none;
    margin: 0 8px;
}
</style>
</head>
<body>
<div class="login-card">
    <img src="img/Logo.png" alt="Logo" class="logo">
    <h1>VIRAL LOOP SOCIAL</h1>

    <div id="message-container"></div>

    <form id="loginForm">
        <input type="email" id="email" name="email" placeholder="Email" required autofocus>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <button type="submit" id="loginBtn">Login</button>
        <div id="login-error" class="error-message" style="display:none;"></div>
    </form>

    <div class="links">
        <a href="/forgot-password">Forgot Password?</a>
        <a href="/signup">Create Account</a>
    </div>

    <div class="footer-text">
        <a href="/privacy">Privacy</a> | 
        <a href="/terms">Terms</a> | 
        <a href="/cookies">Cookies</a>
        <p style="margin-top: 12px;">&copy; 2026 VIRALOOP</p>
    </div>
</div>

<script src="js/Login.js"></script>
<script>
    // Show success messages from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const messageContainer = document.getElementById('message-container');
    
    if (urlParams.get('verified') === 'true') {
        messageContainer.innerHTML = '<div class="success-message">✅ Email verified! You can now log in.</div>';
        setTimeout(() => {
            messageContainer.innerHTML = '';
        }, 5000);
    }
    
    if (urlParams.get('registered') === 'true') {
        messageContainer.innerHTML = '<div class="success-message">✅ Account created! Please check your email to verify your account.</div>';
        setTimeout(() => {
            messageContainer.innerHTML = '';
        }, 5000);
    }
    
    if (urlParams.get('reset') === 'true') {
        messageContainer.innerHTML = '<div class="success-message">✅ Password reset successfully! You can now log in.</div>';
        setTimeout(() => {
            messageContainer.innerHTML = '';
        }, 5000);
    }
</script>
</body>
</html>
