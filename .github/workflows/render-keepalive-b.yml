name: Viraloop Render Keep Alive B

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viraloop-render-keepalive-b
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest

    timeout-minutes: 9

    env:
      URL: https://viraloopsocials.onrender.com/health

    steps:
      - name: Staggered Production Keep Alive
        shell: bash
        run: |

          set +e

          echo "========================================"
          echo "Viraloop Keep Alive B"
          echo "Started $(date -u)"
          echo "========================================"

          # Offset this workflow by 2 minutes
          sleep 120

          ping() {

            code=$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "$URL")

            echo "$(date -u) HTTP $code"

            return 0
          }

          ping

          sleep 20
          ping

          sleep 40
          ping

          sleep 60
          ping

          sleep 90
          ping

          sleep 60
          ping

          echo "Finished $(date -u)"

          exit 0
