name: Viraloop Render Production Keep Alive

on:
  schedule:
    # Runs every 5 minutes (GitHub schedule is best-effort)
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viraloop-render-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Keep Render Warm
    runs-on: ubuntu-latest

    timeout-minutes: 9

    env:
      URL: https://viraloopsocials.onrender.com/health

    steps:

      - name: Production Keep Alive
        shell: bash
        run: |

          set +e

          echo "==============================================="
          echo "Viraloop Render Production Keep Alive"
          echo "Started : $(date -u)"
          echo "Runner  : $RUNNER_NAME"
          echo "==============================================="

          success=0
          failure=0

          ping() {

            echo ""
            echo "-----------------------------------------------"
            echo "Ping Time : $(date -u)"
            echo "Target    : $URL"
            echo "-----------------------------------------------"

            code=$(curl \
              --location \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 120 \
              "$URL")

            if [[ "$code" == "200" ]]; then
              echo "SUCCESS (HTTP 200)"
              success=$((success+1))
              return 0
            fi

            echo "FAILED (HTTP $code)"
            failure=$((failure+1))
            return 1
          }

          # Immediate wake
          ping

          # Verification
          sleep 20
          ping

          # Second verification
          sleep 40
          ping

          # Third verification
          sleep 60
          ping

          # Fourth verification
          sleep 90
          ping

          # Final verification
          sleep 60
          ping

          echo ""
          echo "==============================================="
          echo "Summary"
          echo "Successful : $success"
          echo "Failed     : $failure"
          echo "Finished   : $(date -u)"
          echo "==============================================="

          exit 0
